
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portfolio Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#080808;color:#f5f5f5;min-height:100vh;padding:24px}
.wrap{max-width:1100px;margin:auto}
.panel{background:#141414;border:1px solid #292929;border-radius:16px;padding:22px;margin:18px 0}
h1,h2,h3{margin-bottom:12px}
.muted{color:#888;margin-bottom:18px}
input,textarea{width:100%;background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:12px;margin:8px 0 14px}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:8px;padding:11px 15px;background:#f4f4f4;color:#111;font-weight:700;cursor:pointer}
button:hover{opacity:.85}
button:disabled{opacity:.5;cursor:wait}
.secondary{background:#292929;color:#fff}
.danger{background:#b83232;color:#fff}
.status{margin-top:12px;color:#aaa;overflow-wrap:anywhere}
.hidden{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.project{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;border-bottom:1px solid #292929;padding:16px 0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.project img{width:150px;height:105px;object-fit:cover;border-radius:9px}
.mini{width:65px;height:52px;object-fit:cover;border-radius:6px;border:1px solid #333}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px;margin:12px 0}
.preview-item{position:relative}
.preview-item img{width:100%;height:110px;object-fit:cover;border-radius:8px;border:1px solid #333}
.preview-item button{position:absolute;top:5px;right:5px;padding:5px 8px;background:#b83232;color:white;border-radius:50%}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20;overflow:auto}
.modal-box{background:#141414;border:1px solid #333;border-radius:16px;width:min(720px,100%);max-height:95vh;overflow:auto;padding:22px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.count{color:#999;font-size:13px}
.login{max-width:420px;margin:80px auto}
.empty{color:#777;padding:20px 0}

@media(max-width:650px){
body{padding:12px}
.project{grid-template-columns:90px 1fr}
.project img{width:90px;height:75px}
.project .actions{grid-column:1/-1}
.panel{padding:16px}
}
</style>
</head>

<body>
<div class="wrap">

<!-- LOGIN -->
<div id="loginBox" class="panel login">
<h1>Admin Login</h1>
<p class="muted">Portfolio Management</p>

<form id="loginForm">
<input type="email" id="email" placeholder="Email address" required>
<input type="password" id="password" placeholder="Password" required>
<button id="loginBtn" type="submit">Login</button>
</form>

<p id="loginStatus" class="status"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
<div class="top">
<div>
<h1>Portfolio Admin</h1>
<p class="muted">Manage projects and up to 20 screenshots per project.</p>
</div>
<button class="secondary" id="logoutBtn">Logout</button>
</div>

<div class="panel">
<div class="top">
<h2>Your Projects</h2>
<button id="addBtn">+ Add Project</button>
</div>
<div id="projectList"></div>
</div>
</div>

<!-- PROJECT MODAL -->
<div id="modal" class="modal hidden">
<div class="modal-box">

<div class="modal-head">
<h2 id="modalTitle">Add Project</h2>
<button class="secondary" id="closeModal">Close</button>
</div>

<form id="projectForm">
<input id="title" placeholder="Project Title" required>
<input id="category" placeholder="Category" required>
<textarea id="description" placeholder="Project Description" required></textarea>
<input id="technologies" placeholder="Technologies (comma separated)">

<label for="images">Project screenshots (maximum 20 total)</label>
<input type="file" id="images" accept="image/*" multiple>

<p class="count" id="imageCount">0 / 20 images selected</p>
<div id="previewGrid" class="grid"></div>

<button id="submitBtn" type="submit">Save Project</button>
<p id="uploadStatus" class="status"></p>
</form>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
const config = window.SUPABASE_CONFIG;

/* ==============================
   ADMIN AUTHORIZATION
================================ */

const ADMIN_EMAIL = 'archielumosad2@gmail.com';

function isAuthorizedAdmin(user) {
  return user?.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();
}

const supabaseClient = window.supabase.createClient(
  config.url,
  config.publishableKey
);

const loginBox = document.getElementById('loginBox');
const dashboard = document.getElementById('dashboard');
const loginStatus = document.getElementById('loginStatus');
const projectList = document.getElementById('projectList');
const modal = document.getElementById('modal');
const projectForm = document.getElementById('projectForm');
const uploadStatus = document.getElementById('uploadStatus');

let editing = null;
let existingImages = [];
let newFiles = [];

/* ==============================
   MODAL
================================ */

function openModal(project = null) {
  editing = project;
  existingImages = project ? getImages(project) : [];
  newFiles = [];

  projectForm.reset();
  uploadStatus.textContent = '';

  document.getElementById('modalTitle').textContent =
    project ? 'Edit Project' : 'Add Project';

  document.getElementById('submitBtn').textContent =
    project ? 'Update Project' : 'Upload Project';

  if (project) {
    document.getElementById('title').value = project.title || '';
    document.getElementById('category').value = project.category || '';
    document.getElementById('description').value = project.description || '';

    document.getElementById('technologies').value =
      Array.isArray(project.technologies)
        ? project.technologies.join(', ')
        : (project.technologies || '');
  }

  modal.classList.remove('hidden');
  renderPreview();
}

function closeModal() {
  modal.classList.add('hidden');
  editing = null;
  existingImages = [];
  newFiles = [];
  projectForm.reset();
  renderPreview();
}

function getImages(project) {
  let arr = Array.isArray(project.gallery_images)
    ? project.gallery_images.filter(Boolean)
    : [];

  if (!arr.length && project.image_url) {
    arr = [project.image_url];
  }

  return arr.slice(0, 20);
}

/* ==============================
   IMAGE PREVIEW
================================ */

function renderPreview() {
  const grid = document.getElementById('previewGrid');
  grid.innerHTML = '';

  const total = existingImages.length + newFiles.length;

  document.getElementById('imageCount').textContent =
    `${total} / 20 images selected`;

  const submit = document.getElementById('submitBtn');
  submit.disabled = total === 0;

  existingImages.forEach((url, i) => {
    const box = document.createElement('div');
    box.className = 'preview-item';

    const img = document.createElement('img');
    img.src = url;
    img.alt = 'Existing project image';

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '×';
    remove.title = 'Remove image';

    remove.onclick = () => {
      existingImages.splice(i, 1);
      renderPreview();
    };

    box.append(img, remove);
    grid.appendChild(box);
  });

  newFiles.forEach((file, i) => {
    const box = document.createElement('div');
    box.className = 'preview-item';

    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    img.alt = file.name;

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '×';

    remove.onclick = () => {
      newFiles.splice(i, 1);
      renderPreview();
    };

    box.append(img, remove);
    grid.appendChild(box);
  });
}

document.getElementById('images').addEventListener('change', e => {
  const incoming = Array.from(e.target.files || []);
  const room = 20 - existingImages.length - newFiles.length;

  if (incoming.length > room) {
    uploadStatus.textContent =
      `Only ${room} more image(s) can be added. Maximum is 20.`;
  } else {
    uploadStatus.textContent = '';
  }

  newFiles.push(...incoming.slice(0, Math.max(0, room)));
  e.target.value = '';
  renderPreview();
});

/* ==============================
   BUTTONS
================================ */

document.getElementById('addBtn').onclick = () => openModal();
document.getElementById('closeModal').onclick = closeModal;

modal.addEventListener('click', e => {
  if (e.target === modal) closeModal();
});

/* ==============================
   LOAD PROJECTS
================================ */

async function loadProjects() {
  projectList.textContent = 'Loading projects...';

  const {data, error} = await supabaseClient
    .from('projects')
    .select('*')
    .order('created_at', {ascending: false});

  if (error) {
    projectList.textContent = 'Error: ' + error.message;
    return;
  }

  projectList.innerHTML = '';

  if (!data?.length) {
    projectList.innerHTML = '<p class="empty">No projects yet.</p>';
    return;
  }

  data.forEach(p => {
    const row = document.createElement('div');
    row.className = 'project';

    const img = document.createElement('img');
    img.src = (getImages(p)[0] || '');
    img.alt = p.title || 'Project';

    const info = document.createElement('div');

    const h = document.createElement('h3');
    h.textContent = p.title || 'Untitled';

    const cat = document.createElement('p');
    cat.className = 'muted';
    cat.textContent = (p.category || '') +
      ' · ' + getImages(p).length + ' image(s)';

    info.append(h, cat);

    const actions = document.createElement('div');
    actions.className = 'actions';

    const edit = document.createElement('button');
    edit.className = 'secondary';
    edit.textContent = 'Edit';
    edit.onclick = () => openModal(p);

    const del = document.createElement('button');
    del.className = 'danger';
    del.textContent = 'Delete';
    del.onclick = () => deleteProject(p.id);

    actions.append(edit, del);
    row.append(img, info, actions);
    projectList.append(row);
  });
}

/* ==============================
   UPLOAD IMAGES
================================ */

async function uploadFiles(files) {
  let urls = [];

  for (const file of files) {
    const ext = (file.name.split('.').pop() || 'jpg')
      .toLowerCase()
      .replace(/[^a-z0-9]/g, '');

    const path =
      `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

    const {error} = await supabaseClient.storage
      .from('project-images')
      .upload(path, file, {upsert: false});

    if (error) throw error;

    const {data} = supabaseClient.storage
      .from('project-images')
      .getPublicUrl(path);

    urls.push(data.publicUrl);
  }

  return urls;
}

/* ==============================
   SAVE PROJECT
================================ */

projectForm.addEventListener('submit', async e => {
  e.preventDefault();

  const btn = document.getElementById('submitBtn');

  if (existingImages.length + newFiles.length < 1) {
    uploadStatus.textContent = 'Please select at least one image.';
    return;
  }

  btn.disabled = true;
  uploadStatus.textContent = 'Uploading images and saving project...';

  try {
    const uploaded = await uploadFiles(newFiles);
    const gallery = [...existingImages, ...uploaded].slice(0, 20);

    const technologies = document.getElementById('technologies')
      .value.split(',')
      .map(x => x.trim())
      .filter(Boolean);

    const payload = {
      title: document.getElementById('title').value.trim(),
      category: document.getElementById('category').value.trim(),
      description: document.getElementById('description').value.trim(),
      image_url: gallery[0] || null,
      gallery_images: gallery,
      technologies
    };

    let result;

    if (editing) {
      result = await supabaseClient
        .from('projects')
        .update(payload)
        .eq('id', editing.id);
    } else {
      result = await supabaseClient
        .from('projects')
        .insert(payload);
    }

    if (result.error) throw result.error;

    uploadStatus.textContent = 'Saved successfully!';
    await loadProjects();
    setTimeout(closeModal, 500);

  } catch (err) {
    uploadStatus.textContent = 'Save failed: ' + err.message;

  } finally {
    btn.disabled = false;
  }
});

/* ==============================
   DELETE PROJECT
================================ */

async function deleteProject(id) {
  if (!confirm(
    'Delete this project? This removes the project record, but uploaded files remain in storage.'
  )) return;

  const {error} = await supabaseClient
    .from('projects')
    .delete()
    .eq('id', id);

  if (error) {
    alert('Delete failed: ' + error.message);
    return;
  }

  await loadProjects();
}

/* ==============================
   LOGIN
================================ */

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  loginStatus.textContent = 'Logging in...';

  try {
    const {data, error} = await supabaseClient.auth.signInWithPassword({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    });

    if (error) throw error;

    // Verify admin email
    if (!isAuthorizedAdmin(data.user)) {
      await supabaseClient.auth.signOut();
      throw new Error('Unauthorized account. Admin access denied.');
    }

    showDashboard();

  } catch (err) {
    loginStatus.textContent = err.message;

  } finally {
    btn.disabled = false;
  }
});

/* ==============================
   SHOW DASHBOARD
================================ */

function showDashboard() {
  loginBox.classList.add('hidden');
  dashboard.classList.remove('hidden');
  loadProjects();
}

/* ==============================
   CHECK SESSION
================================ */

async function checkSession() {
  const {data, error} = await supabaseClient.auth.getSession();

  if (error) {
    loginStatus.textContent = error.message;
    return;
  }

  if (data?.session) {
    const user = data.session.user;

    // Verify session belongs to admin
    if (!isAuthorizedAdmin(user)) {
      await supabaseClient.auth.signOut();
      loginBox.classList.remove('hidden');
      dashboard.classList.add('hidden');
      loginStatus.textContent = 'Unauthorized account. Admin access denied.';
      return;
    }

    showDashboard();
  }
}

/* ==============================
   LOGOUT
================================ */

document.getElementById('logoutBtn').onclick = async () => {
  const {error} = await supabaseClient.auth.signOut();

  if (error) {
    alert(error.message);
    return;
  }

  dashboard.classList.add('hidden');
  loginBox.classList.remove('hidden');
  loginStatus.textContent = '';
};

/* INIT */
checkSession();
</script>

</body>
</html>
